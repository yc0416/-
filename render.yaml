services:
  - type: web
    name: our-gallery
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: GALLERY_DATA_DIR
        value: /tmp/gallery
      - key: GALLERY_SECURE_COOKIE
        value: "1"
      - key: GALLERY_REQUIRE_CLOUD
        value: "1"
      - key: GALLERY_INVITE_CODE
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

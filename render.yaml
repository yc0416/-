services:
  - type: web
    name: our-gallery
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/health
    envVars:
      - key: GALLERY_DATA_DIR
        value: /data
      - key: GALLERY_SECURE_COOKIE
        value: "1"
      - key: GALLERY_INVITE_CODE
        sync: false
    disk:
      name: gallery-data
      mountPath: /data
      sizeGB: 1
